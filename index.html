<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }

  :root{
    --paper:#EDEAE0; --paper-line:#DBD3C2; --card:#F7F4EC;
    --ink:#28241F; --ink-soft:#6E6656;
    --seal:#A73B2E; --seal-soft:#EFDAD1;
    --brass:#8A6A2F; --brass-soft:#F1E4C4;
    --shadow:0 10px 28px rgba(40,36,31,.18);
    --shadow-soft:0 4px 14px rgba(40,36,31,.10);
    --radius-lg:20px; --radius-sm:8px; --pill:999px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="dark"]{
    --paper:#1C1A17; --paper-line:#332F28; --card:#252220;
    --ink:#EEE7D8; --ink-soft:#A79D8B;
    --seal:#DD7A5F; --seal-soft:#3C2A22;
    --brass:#DAB35B; --brass-soft:#3A2F1A;
    --shadow:0 10px 32px rgba(0,0,0,.45);
    --shadow-soft:0 4px 16px rgba(0,0,0,.3);
  }

  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-top);
    min-height:100vh;
    display: flex;
    flex-direction: column;
  }
  body.modal-open{ overflow:hidden; }
  .serif{ font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
  button{ font-family:inherit; }

  /* ---------- Header (cover) ---------- */
  .cover{
    position:sticky; top:0; z-index:20; background:var(--paper);
    padding:22px 20px 14px; border-bottom:1px solid var(--paper-line);
  }
  .cover-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .cover-title{ display:flex; align-items:center; gap:8px; }
  .cover-title h1{ font-size:22px; margin:0; font-weight:700; }
  .cover-mark{ font-size:22px; }
  .cover-sub{ font-size:12.5px; color:var(--ink-soft); margin:6px 0 0; }

  .header-btns{ display:flex; gap:8px; position:relative; flex-shrink:0; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--paper-line);
    background:var(--card); font-size:16px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s ease;
  }
  .icon-btn:active{ transform:scale(.92); }

  .menu-panel{
    position:absolute; top:46px; right:0; background:var(--card); border:1px solid var(--paper-line);
    border-radius:12px; box-shadow:var(--shadow); padding:6px; display:none; min-width:168px; z-index:30;
  }
  .menu-panel.open{ display:block; }
  .menu-panel button{
    width:100%; text-align:left; padding:10px 12px; border:none; background:none; color:var(--ink);
    font-size:13.5px; border-radius:8px; cursor:pointer;
  }
  .menu-panel button:hover{ background:var(--seal-soft); }

  /* ---------- Toolbar ---------- */
  .toolbar{ padding:14px 20px 6px; display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .toolbar select{
    flex:1; max-width: 130px; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--paper-line);
    background:var(--card); color:var(--ink); font-size:12px;
  }
  .view-toggles { display: flex; gap: 4px; background: var(--paper-line); padding: 4px; border-radius: var(--pill); }
  .view-toggles button { border: none; background: transparent; padding: 6px 12px; border-radius: var(--pill); font-size: 13px; cursor: pointer; transition:.2s; }
  .view-toggles button.active { background: var(--card); box-shadow: var(--shadow-soft); }
  .count-badge{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }

  /* ---------- Main Area ---------- */
  main{ padding:6px 20px 20px; flex: 1; }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:70px 20px; line-height:1.9; font-size:14px; }
  .empty-state .big{ font-size:30px; display:block; margin-bottom:10px; }

  /* --- Rich List (リッチ表示) --- */
  .ledger-row{
    display:flex; gap:13px; padding:15px 2px; border-bottom:1px solid var(--paper-line); position:relative;
  }
  .ledger-row:first-child{ border-top:1px solid var(--paper-line); }
  .ledger-row.pinned{ background:linear-gradient(to right, var(--seal-soft), transparent 55%); }
  
  .day-leaf{
    flex-shrink:0; width:50px; height:56px; border-radius:7px; background:var(--card);
    border:1px solid var(--paper-line); display:flex; flex-direction:column; align-items:center;
    justify-content:center; position:relative; overflow:hidden;
  }
  .day-leaf:before{ content:''; position:absolute; top:0; left:0; right:0; height:6px; background:var(--ink-soft); }
  .ledger-row.pinned .day-leaf:before{ background:var(--seal); }
  .leaf-month{ font-size:10px; color:var(--ink-soft); margin-top:9px; }
  .leaf-day{ font-size:19px; font-weight:700; line-height:1.15; margin-top:1px; }

  .row-body{ flex:1; min-width:0; }
  .row-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .row-name{ font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .row-name .ty-icon{ font-size:15px; }
  .pin-toggle{ background:none; border:none; font-size:17px; cursor:pointer; opacity:.55; padding:2px 4px; flex-shrink:0; }
  .pin-toggle.active{ opacity:1; }

  .row-countdown{ margin-top:6px; font-size:13.5px; font-weight:600; color:var(--seal); }
  .row-countdown .sep{ color:var(--ink-soft); font-weight:400; margin:0 3px; }
  .row-count{ color:var(--brass); font-weight:600; }

  .row-meta{ margin-top:7px; }
  .chip{
    display:inline-block; font-size:11.5px; padding:3px 10px; border-radius:var(--pill);
    background:var(--brass-soft); color:var(--brass); border:1px solid transparent;
  }
  .row-note{
    margin-top:8px; font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap;
    line-height:1.6; border-left:2px solid var(--paper-line); padding-left:9px;
  }
  .row-actions{ margin-top:10px; display:flex; gap:8px; }
  .row-actions button{
    font-size:11.5px; padding:5px 13px; border-radius:var(--pill); border:1px solid var(--paper-line);
    background:var(--card); color:var(--ink-soft); cursor:pointer;
  }
  .row-actions button.danger{ color:var(--seal); border-color:var(--seal-soft); }

  /* --- Slim List (スリム表示) --- */
  .ledger-row-slim {
    display: flex; gap: 10px; padding: 10px; background: var(--card);
    border-radius: var(--radius-sm); border: 1px solid var(--paper-line);
    align-items: center; margin-bottom: 8px; position: relative;
  }
  .ledger-row-slim.pinned { border-left: 4px solid var(--seal); }
  .ledger-row-slim .day-leaf {
    width: 38px; height: 38px; border-radius: 4px; border: 1px solid var(--paper-line); background: var(--paper);
  }
  .ledger-row-slim .leaf-month { font-size: 8px; margin-top: 4px; }
  .ledger-row-slim .leaf-day { font-size: 14px; font-weight: 700; margin-top: -1px; }
  .slim-body { flex: 1; min-width: 0; display:flex; flex-direction:column; gap:2px; }
  .slim-name-row { display: flex; align-items: center; gap: 4px; }
  .slim-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slim-count { font-size: 11px; color: var(--brass); font-weight:700; }
  .slim-days { font-size: 11px; color: var(--seal); font-weight: 700; }
  .slim-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .slim-actions button { background: none; border: none; font-size: 15px; cursor: pointer; padding: 4px; }

  /* --- Calendar View (カレンダー表示) --- */
  .calendar-wrap { display: none; }
  .calendar-wrap.active { display: block; }
  .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .cal-header button { background:var(--card); border:1px solid var(--paper-line); padding:6px 14px; border-radius:var(--pill); cursor:pointer; color:var(--ink); font-weight:700;}
  .cal-title { font-size: 16px; font-weight: 700; }
  .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head-cell { text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:6px; font-weight:700; }
  .cal-cell { aspect-ratio: 1; background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; display:flex; flex-direction:column; padding: 4px; cursor:pointer; position:relative; }
  .cal-cell.empty { background: transparent; border-color: transparent; cursor:default; }
  .cal-cell.today { border: 1.5px solid var(--seal); background: var(--seal-soft); }
  .cal-cell .cal-date { font-size: 12px; font-weight: 700; text-align:center; }
  .cal-cell .cal-icons { font-size: 10px; display:flex; flex-wrap:wrap; justify-content:center; gap: 2px; margin-top: auto; }
  
  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:calc(24px + var(--safe-bottom));
    width:54px; height:54px; border-radius:50%; border:none;
    background:var(--seal); color:#fff; font-size:26px; box-shadow:var(--shadow);
    cursor:pointer; z-index:25; line-height:1; transition:transform .12s ease;
  }
  .fab:active{ transform:scale(.93); }

  /* ---------- PR Section ---------- */
  .pr-section {
    text-align: center;
    padding: 20px 20px calc(90px + var(--safe-bottom)); /* FABに被らないよう余白を確保 */
  }
  .pr-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .pr-banner {
    display: flex;
    justify-content: center;
  }

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,17,13,.5); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:var(--paper); width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0; padding:20px 20px calc(20px + var(--safe-bottom));
    box-shadow:var(--shadow);
  }
  @media (min-width:520px){
    .modal-overlay{ align-items:center; }
    .modal-card{ border-radius:var(--radius-lg); }
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h2{ font-size:17px; margin:0; }
  .modal-head button{ background:none; border:none; font-size:19px; color:var(--ink-soft); cursor:pointer; padding:4px; }

  /* フォーム要素 */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; padding:10px 11px; border-radius:var(--radius-sm); border:1px solid var(--paper-line);
    background:var(--card); color:var(--ink); font-size:15px; font-family:inherit;
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .row3{ display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:9px; }
  .segmented{ display:flex; border:1px solid var(--paper-line); border-radius:var(--pill); overflow:hidden; }
  .segmented input{ display:none; }
  .segmented label{ flex:1; text-align:center; padding:10px 0; font-size:13.5px; cursor:pointer; color:var(--ink-soft); }
  .segmented input:checked + label{ background:var(--seal); color:#fff; font-weight:700; }

  .switch-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 2px; }
  .switch-row > span{ font-size:14px; }
  .switch{ position:relative; width:44px; height:25px; display:inline-block; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{ position:absolute; inset:0; background:var(--paper-line); border-radius:var(--pill); transition:.2s; }
  .switch .track:before{ content:''; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .track{ background:var(--seal); }
  .switch input:checked + .track:before{ transform:translateX(19px); }

  .btn-primary{ width:100%; padding:13px; border:none; border-radius:var(--pill); background:var(--seal); color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; }
  .btn-secondary{ width:100%; padding:11px; border:1px solid var(--paper-line); border-radius:var(--pill); background:none; color:var(--ink-soft); font-size:13.5px; cursor:pointer; margin-top:8px; }

  /* ---------- Day popup (邪魔なやつ) ---------- */
  .popup-overlay{
    position:fixed; inset:0; background:rgba(15,12,9,.72); display:none;
    align-items:center; justify-content:center; z-index:100; padding:22px;
  }
  .popup-overlay.open{ display:flex; }
  .popup-card{
    background:var(--card); border-radius:22px; padding:30px 24px; max-width:340px; width:100%;
    text-align:center; box-shadow:var(--shadow); border:1px solid var(--paper-line);
    animation:popIn .25s ease;
  }
  @keyframes popIn{ from{ transform:scale(.92); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .popup-seal{
    width:52px; height:52px; border-radius:50%; background:var(--seal-soft); color:var(--seal);
    display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto;
  }
  .popup-label{ font-size:12.5px; color:var(--ink-soft); margin-top:12px; }
  .popup-title{ font-size:20px; font-weight:700; margin:6px 0 12px; line-height:1.4; }
  .popup-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.75; margin-bottom:22px; }
  .popup-close-btn{
    width:100%; padding:13px; border:none; border-radius:var(--pill);
    background:var(--paper-line); color:var(--ink-soft); font-size:14.5px; font-weight:700; cursor:not-allowed;
  }
  .popup-close-btn.ready{ background:var(--seal); color:#fff; cursor:pointer; }
</style>
</head>
<body>

<header class="cover">
  <div class="cover-row">
    <div>
      <div class="cover-title">
        <span class="cover-mark">🎂</span>
        <h1 class="serif">記念日ノート</h1>
      </div>
      <p class="cover-sub">誕生日と記念日を、ひとつのノートに。</p>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="themeToggle" aria-label="ダークモード切替">🌙</button>
      <button class="icon-btn" id="menuBtn" aria-label="メニュー">⋮</button>
      <div class="menu-panel" id="menuPanel">
        <button type="button" id="exportBtn">📤 エクスポート</button>
        <button type="button" id="importBtn">📥 インポート</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
</header>

<div class="toolbar">
  <select id="groupFilter"></select>
  <div class="view-toggles" id="viewToggles">
    <button data-view="rich" class="active" aria-label="リッチ表示">📋</button>
    <button data-view="slim" aria-label="スリム表示">📜</button>
    <button data-view="calendar" aria-label="カレンダー">📅</button>
  </div>
  <span class="count-badge" id="countBadge"></span>
</div>

<!-- リストビュー (リッチ・スリム共用) -->
<main id="entryList"></main>

<!-- カレンダービュー -->
<main class="calendar-wrap" id="calendarView">
  <div class="cal-header">
    <button id="calPrev">◀ 先月</button>
    <div class="cal-title" id="calTitle">2026年 9月</div>
    <button id="calNext">来月 ▶</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</main>

<!-- アフィリエイト枠 -->
<div class="pr-section">
  <div class="pr-label">※PR</div>
  <div class="pr-banner">
    <script type="text/javascript">rakuten_design="slide";rakuten_affiliateId="1713d060.335a82be.1713d061.5d5faf0d";rakuten_items="ctsmatch";rakuten_genreId="0";rakuten_size="320x48";rakuten_target="_blank";rakuten_theme="gray";rakuten_border="off";rakuten_auto_mode="on";rakuten_genre_title="off";rakuten_recommend="on";rakuten_ts="1790643374623";</script><script type="text/javascript" src="https://xml.affiliate.rakuten.co.jp/widget/js/rakuten_widget.js?20230106"></script>
  </div>
</div>

<button class="fab" id="fabAdd" aria-label="新規登録">＋</button>

<!-- Add / Edit modal -->
<div class="modal-overlay" id="entryModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">新規登録</h2>
      <button type="button" id="modalClose" aria-label="閉じる">✕</button>
    </div>
    <form id="entryForm">
      <div class="field">
        <label>タイプ</label>

        <label>名前<span style="color:var(--seal)"> *</span></label>

      </div>
      <div class="row3">
        <div class="field">
          <label>年（任意）</label>
          <input type="number" id="f_year" placeholder="1990">

        <div class="field">
          <label>月</label>
          <select id="f_month"></select>

        <div class="field">

<!-- カレンダー用 詳細モーダル -->

    </div>
    <div id="calDetailList"></div>
  </div>
</div>

<!-- Forced day-trivia popup -->
<div class="popup-overlay" id="dayPopup">

    <div class="popup-seal">🎉</div>

    <div class="popup-desc" id="popupDesc"></div>

      <span class="btn-label">閉じる</span> <span class="btn-count">(<span id="popupCountdown">3</span>)</span>
    </button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var STORAGE_KEY = 'anniv_entries_v1';
  var THEME_KEY = 'anniv_theme_v1';

  var entries = loadEntries();
  var currentFilter = 'all';
  var currentView = 'rich'; // rich, slim, calendar
  var editingId = null;
  var calCurrentDate = new Date();

  var entryModal = document.getElementById('entryModal');
  var entryForm = document.getElementById('entryForm');
  var dayPopup = document.getElementById('dayPopup');
  var menuPanel = document.getElementById('menuPanel');
  var calDetailModal = document.getElementById('calDetailModal');

  /* ---------- 365日分の記念日データ ---------- */

  /* ---------- storage ---------- */
  function loadEntries(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
  }
  function saveEntries(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){}
  }
  function uid(){ return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  /* ---------- date helpers ---------- */
  function todayDateOnly(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function isLeap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }

  function getNextOccurrence(entry, base){
    base = base || todayDateOnly();
    var y = base.getFullYear();
    function buildDate(year){
      var d = entry.day;
      if(entry.month === 2 && entry.day === 29 && !isLeap(year)) d = 28;
      return new Date(year, entry.month - 1, d);
    }
    var candidate = buildDate(y);
    if(candidate < base) candidate = buildDate(y + 1);
    return candidate;
  }
  function daysUntil(date, base){
    base = base || todayDateOnly();
    return Math.round((date.getTime() - base.getTime()) / 86400000);
  }

  var MILESTONE_AGES = [18,20,30,40,50,60,70,77,80,88,90,99,100];
  var MILESTONE_ANNIV = [1,3,5,10,15,20,25,30,40,50,60,70];
  function computeCount(entry, nextDate){
    if(!entry.year) return null;
    return nextDate.getFullYear() - entry.year;
  }
  function isMilestone(entry, count){
    if(count == null) return false;
    var list = entry.type === 'birthday' ? MILESTONE_AGES : MILESTONE_ANNIV;
    return list.indexOf(count) !== -1;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  /* ---------- rendering components ---------- */
  // 📋 リッチカード
  function renderRichCard(e){
    var typeIcon = e.type === 'birthday' ? '🎂' : '💍';
    var dayLabel = e._days === 0 ? '🎉 今日です！' : ('あと' + e._days + '日');
    var countLabel = e._count != null ? (e.type === 'birthday' ? (e._count + '歳') : (e._count + '周年')) : '';
    var crown = e._milestone ? ' 👑' : '';
    var groupHtml = e.group ? '<span class="chip">' + escapeHtml(e.group) + '</span>' : '';
    var noteHtml = e.note ? '<div class="row-note">' + escapeHtml(e.note).replace(/\n/g,'<br>') + '</div>' : '';

    return (
      '<div class="ledger-row' + (e.pinned ? ' pinned' : '') + '">' +
        '<div class="day-leaf"><span class="leaf-month">' + e.month + '月</span><span class="leaf-day">' + e.day + '</span></div>' +
        '<div class="row-body">' +
          '<div class="row-top">' +
            '<div class="row-name"><span class="ty-icon">' + typeIcon + '</span>' + escapeHtml(e.name) + crown + '</div>' +
            '<button type="button" class="pin-toggle' + (e.pinned ? ' active' : '') + '" data-action="pin" data-id="' + e.id + '">📌</button>' +
          '</div>' +
          '<div class="row-countdown">' + dayLabel + (countLabel ? '<span class="sep">・</span><span class="row-count">' + countLabel + '</span>' : '') + '</div>' +
          (groupHtml ? '<div class="row-meta">' + groupHtml + '</div>' : '') + noteHtml +
          '<div class="row-actions">' +
            '<button type="button" data-action="edit" data-id="' + e.id + '">編集</button>' +
            '<button type="button" class="danger" data-action="delete" data-id="' + e.id + '">削除</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // 📜 スリムカード
  function renderSlimCard(e){
    var typeIcon = e.type === 'birthday' ? '🎂' : '💍';
    var countLabel = e._count != null ? (e.type === 'birthday' ? (e._count + '歳') : (e._count + '周年')) : '';
    var dayLabel = e._days === 0 ? '本日!' : ('あと'+e._days+'日');

    return (
      '<div class="ledger-row-slim' + (e.pinned ? ' pinned' : '') + '">' +
        '<div class="day-leaf"><span class="leaf-month">' + e.month + '月</span><span class="leaf-day">' + e.day + '</span></div>' +
        '<div class="slim-body">' +
          '<div class="slim-name-row"><span class="ty-icon">' + typeIcon + '</span><span class="slim-name">' + escapeHtml(e.name) + '</span></div>' +
          '<div>' + (countLabel ? '<span class="slim-count">' + countLabel + '</span> ' : '') + '<span class="slim-days">' + dayLabel + '</span></div>' +
        '</div>' +
        '<div class="slim-actions">' +
          '<button type="button" data-action="edit" data-id="' + e.id + '">✏️</button>' +
          '<button type="button" class="danger" data-action="delete" data-id="' + e.id + '">🗑️</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- render main view ---------- */
  function renderView(){
    var groups = [];
    entries.forEach(function(e){ if(e.group && groups.indexOf(e.group) === -1) groups.push(e.group); });
    groups.sort();
    
    var sel = document.getElementById('groupFilter');
    var html = '<option value="all">すべてのグループ</option>';
    for(var i=0;i<groups.length;i++) html += '<option value="' + escapeHtml(groups[i]) + '">' + escapeHtml(groups[i]) + '</option>';
    sel.innerHTML = html;
    if(groups.indexOf(currentFilter) === -1) currentFilter = 'all';
    sel.value = currentFilter;

    var filtered = entries.filter(e => currentFilter === 'all' || e.group === currentFilter);
    var enriched = filtered.map(function(e){
      var next = getNextOccurrence(e);
      var count = computeCount(e, next);
      return Object.assign({}, e, { _days: daysUntil(next), _count: count, _milestone: isMilestone(e, count) });
    }).sort((a,b) => (a.pinned === b.pinned) ? (a._days - b._days) : (a.pinned ? -1 : 1));

    document.getElementById('countBadge').textContent = enriched.length + '件';

    var listEl = document.getElementById('entryList');
    var calEl = document.getElementById('calendarView');

    if(currentView === 'calendar') {
      listEl.style.display = 'none';
      calEl.classList.add('active');
      renderCalendar();
    } else {
      calEl.classList.remove('active');
      listEl.style.display = 'block';
      if(enriched.length === 0){
        listEl.innerHTML = '<div class="empty-state"><span class="big">📭</span>まだ登録がありません<br>右下の＋ボタンから追加してみましょう</div>';
      } else {
        listEl.innerHTML = enriched.map(e => currentView === 'rich' ? renderRichCard(e) : renderSlimCard(e)).join('');
      }
    }
  }

  /* ---------- Calendar logic ---------- */
  function renderCalendar() {
    var year = calCurrentDate.getFullYear();
    var month = calCurrentDate.getMonth();
    document.getElementById('calTitle').textContent = year + "年 " + (month + 1) + "月";

    var firstDay = new Date(year, month, 1).getDay();
    var daysInM = daysInMonth(year, month + 1);
    var today = new Date();
    var isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);

    var html = '<div class="cal-head-cell">日</div><div class="cal-head-cell">月</div><div class="cal-head-cell">火</div><div class="cal-head-cell">水</div><div class="cal-head-cell">木</div><div class="cal-head-cell">金</div><div class="cal-head-cell">土</div>';
    
    for(var i=0; i<firstDay; i++) html += '<div class="cal-cell empty"></div>';
    
    for(var d=1; d<=daysInM; d++){
      var isToday = (isCurrentMonth && today.getDate() === d);
      var cls = 'cal-cell' + (isToday ? ' today' : '');
      var dayEntries = entries.filter(e => e.month === (month + 1) && e.day === d);
      var icons = dayEntries.map(e => e.type === 'birthday' ? '🎂' : '💍').join('');
      
      html += '<div class="' + cls + '" data-day="' + d + '">' +
                '<div class="cal-date">' + d + '</div>' +
                '<div class="cal-icons">' + icons + '</div>' +
              '</div>';
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  document.getElementById('calPrev').addEventListener('click', () => { calCurrentDate.setMonth(calCurrentDate.getMonth() - 1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', () => { calCurrentDate.setMonth(calCurrentDate.getMonth() + 1); renderCalendar(); });

  document.getElementById('calGrid').addEventListener('click', function(ev){
    var cell = ev.target.closest('.cal-cell');
    if(!cell || cell.classList.contains('empty')) return;
    var d = parseInt(cell.getAttribute('data-day'), 10);
    var m = calCurrentDate.getMonth() + 1;
    var dayEntries = entries.filter(e => e.month === m && e.day === d);
    
    document.getElementById('calDetailTitle').textContent = m + "月" + d + "日";
    var list = document.getElementById('calDetailList');
    if(dayEntries.length === 0){
      list.innerHTML = '<div style="text-align:center;color:var(--ink-soft);padding:30px 0;">予定はありません</div>';
    } else {
      var enriched = dayEntries.map(e => {
        var next = getNextOccurrence(e);
        var count = computeCount(e, next);
        return Object.assign({}, e, { _days: daysUntil(next), _count: count });
      });
      list.innerHTML = enriched.map(e => renderSlimCard(e)).join('');
    }
    calDetailModal.classList.add('open');
    refreshScrollLock();
  });

  document.getElementById('calDetailClose').addEventListener('click', () => {
    calDetailModal.classList.remove('open');
    refreshScrollLock();
  });

  /* ---------- list / global actions ---------- */
  document.addEventListener('click', function(ev){
    var btn = ev.target.closest('button[data-action]');
    if(!btn) return;
    var id = btn.getAttribute('data-id');
    var action = btn.getAttribute('data-action');
    if(action === 'pin') togglePin(id);
    if(action === 'edit') openEditModal(id);
    if(action === 'delete') deleteEntry(id);
  });

  function togglePin(id){
    var e = entries.find(x => x.id === id);
    if(e){ e.pinned = !e.pinned; saveEntries(); renderView(); }
  }
  function deleteEntry(id){
    var e = entries.find(x => x.id === id);
    if(!e) return;
    if(confirm('「' + e.name + '」を削除しますか？')){
      entries = entries.filter(x => x.id !== id);
      saveEntries();
      renderView();
      if (calDetailModal.classList.contains('open')) calDetailModal.classList.remove('open');
    }
  }

  /* ---------- View toggles & filter ---------- */
  document.querySelectorAll('#viewToggles button').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      document.querySelectorAll('#viewToggles button').forEach(b => b.classList.remove('active'));
      ev.currentTarget.classList.add('active');
      currentView = ev.currentTarget.dataset.view;
      renderView();
    });
  });
  document.getElementById('groupFilter').addEventListener('change', function(ev){
    currentFilter = ev.target.value; renderView();
  });

  /* ---------- modal: add / edit ---------- */
  function populateMonthSelect(){
    var sel = document.getElementById('f_month');
    var html = '';
    for(var m=1;m<=12;m++) html += '<option value="' + m + '">' + m + '月</option>';
    sel.innerHTML = html;
  }
  function updateDayOptions(keepValue){
    var month = parseInt(document.getElementById('f_month').value, 10);
    var daySel = document.getElementById('f_day');
    var prev = keepValue != null ? keepValue : daySel.value;
    var maxDay = daysInMonth(2024, month); /* うるう年ベース */
    var html = '';
    for(var d=1; d<=maxDay; d++) html += '<option value="' + d + '">' + d + '日</option>';
    daySel.innerHTML = html;
    if(prev && parseInt(prev,10) <= maxDay) daySel.value = prev;
  }
  document.getElementById('f_month').addEventListener('change', function(){ updateDayOptions(); });

  function refreshScrollLock(){
    var locked = dayPopup.classList.contains('open') || entryModal.classList.contains('open') || calDetailModal.classList.contains('open');
    document.body.classList.toggle('modal-open', locked);
  }

  function openEditModal(id){
    editingId = id;
    var e = id ? entries.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = id ? '編集' : '新規登録';

    document.getElementById(e && e.type === 'anniversary' ? 'type_anniversary' : 'type_birthday').checked = true;
    document.getElementById('f_name').value = e ? e.name : '';
    document.getElementById('f_year').value = (e && e.year) ? e.year : '';
    document.getElementById('f_month').value = e ? e.month : (new Date().getMonth() + 1);
    updateDayOptions(e ? e.day : new Date().getDate());
    document.getElementById('f_group').value = e ? (e.group || '') : '';
    document.getElementById('f_note').value = e ? (e.note || '') : '';
    document.getElementById('f_pinned').checked = e ? !!e.pinned : false;

    entryModal.classList.add('open');
    refreshScrollLock();
    menuPanel.classList.remove('open');
  }
  function closeEditModal(){ entryModal.classList.remove('open'); editingId = null; refreshScrollLock(); }
  document.getElementById('fabAdd').addEventListener('click', function(){ openEditModal(null); });
  document.getElementById('modalClose').addEventListener('click', closeEditModal);
  document.getElementById('modalCancel').addEventListener('click', closeEditModal);
  entryModal.addEventListener('click', function(ev){ if(ev.target === entryModal) closeEditModal(); });
  calDetailModal.addEventListener('click', function(ev){ if(ev.target === calDetailModal) { calDetailModal.classList.remove('open'); refreshScrollLock(); } });

  entryForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    var name = document.getElementById('f_name').value.trim();
    if(!name){ alert('名前を入力してください'); return; }
    var yearRaw = document.getElementById('f_year').value;
    var data = {
      type: document.querySelector('input[name="type"]:checked').value,
      name: name,
      year: yearRaw ? parseInt(yearRaw,10) : null,
      month: parseInt(document.getElementById('f_month').value,10),
      day: parseInt(document.getElementById('f_day').value,10),
      group: document.getElementById('f_group').value.trim(),
      note: document.getElementById('f_note').value,
      pinned: document.getElementById('f_pinned').checked
    };
    if(editingId){
      var idx = entries.findIndex(x => x.id === editingId);
      if(idx !== -1){ data.id = entries[idx].id; entries[idx] = data; }
    } else {
      data.id = uid(); entries.push(data);
    }
    saveEntries(); closeEditModal(); renderView();
    if (calDetailModal.classList.contains('open')) calDetailModal.classList.remove('open');
  });

  /* ---------- menu: export / import ---------- */
  document.getElementById('menuBtn').addEventListener('click', function(ev){
    ev.stopPropagation(); menuPanel.classList.toggle('open');
  });
  document.addEventListener('click', function(ev){
    if(!menuPanel.contains(ev.target) && ev.target.id !== 'menuBtn') menuPanel.classList.remove('open');
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var t = new Date();
    var ymd = t.getFullYear() + String(t.getMonth()+1).padStart(2,'0') + String(t.getDate()).padStart(2,'0');
    a.href = url; a.download = '記念日データ_' + ymd + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url); menuPanel.classList.remove('open');
  });

  document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function(ev){
    var file = ev.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!Array.isArray(data)) throw new Error('invalid');
        var valid = data.filter(x => x && typeof x.name === 'string' && x.month && x.day);
        if(valid.length === 0){ alert('有効なデータが見つかりませんでした'); return; }
        if(confirm(valid.length + '件のデータを追加しますか？')){
          valid.forEach(x => {
            entries.push({
              id: uid(), type: x.type === 'anniversary' ? 'anniversary' : 'birthday', name: x.name,
              year: x.year || null, month: x.month, day: x.day, group: x.group || '', note: x.note || '', pinned: !!x.pinned
            });
          });
          saveEntries(); renderView(); alert('読み込み完了');
        }
      }catch(err){ alert('ファイルの読み込みに失敗しました。'); }
      ev.target.value = '';
    };
    reader.readAsText(file); menuPanel.classList.remove('open');
  });

  /* ---------- theme ---------- */
  function updateThemeIcon(){
    var theme = document.documentElement.getAttribute('data-theme') || 'light';
    document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  document.getElementById('themeToggle').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    updateThemeIcon();
  });

  /* ---------- the annoyingly-well-timed day popup ---------- */
  function getDayFact(month, day) {
    var mData = RAW_DAYS[month];
    if(mData) {
      var arr = mData.split(',');
      if(arr[day - 1]) return arr[day - 1];
    }
    return "何かの日";
  }

  function pickTodayFact(){
    var t = new Date();
    var fact = getDayFact(t.getMonth() + 1, t.getDate());
    return { 
      title: fact + "の日", 
      desc: "実用性ゼロ工房が365日分無理やり詰め込んだ本日の豆知識です。毎日チェックしても特に良いことは起こりませんが、雑談のネタにはなるかもしれません。" 
    };
  }

  function showDayPopup(){
    var fact = pickTodayFact();
    document.getElementById('popupTitle').textContent = '「' + fact.title + '」です！';
    document.getElementById('popupDesc').textContent = fact.desc;

    var closeBtn = document.getElementById('popupCloseBtn');
    var countdownEl = document.getElementById('popupCountdown');
    var countEl = closeBtn.querySelector('.btn-count');
    closeBtn.disabled = true;
    closeBtn.classList.remove('ready');
    countEl.style.display = '';
    var remain = 3;
    countdownEl.textContent = remain;

    dayPopup.classList.add('open');
    refreshScrollLock();

    var timer = setInterval(function(){
      remain--;
      if(remain <= 0){
        clearInterval(timer);
        closeBtn.disabled = false;
        closeBtn.classList.add('ready');
        countEl.style.display = 'none';
      } else {
        countdownEl.textContent = remain;
      }
    }, 1000);
  }
  document.getElementById('popupCloseBtn').addEventListener('click', function(){
    dayPopup.classList.remove('open');
    refreshScrollLock();
  });

  /* ---------- init ---------- */
  document.addEventListener('DOMContentLoaded', function(){
    populateMonthSelect();
    updateDayOptions(new Date().getDate());
    document.getElementById('f_year').max = new Date().getFullYear();
    updateThemeIcon();
    renderView();
    showDayPopup();
  });
})();
</script>
</body>
</html>
