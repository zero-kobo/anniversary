<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  :root{
    --bg:#F3F4FA; --surface:#FFFFFF; --line:#E3E5F0; --ink:#1C1F3B; --sub:#6B7090;
    --bd:#4F5BD5; --bd-soft:#E8EAFB; --an:#D9467A; --an-soft:#FBE6EE;
    --primary:#1C1F3B; --on-primary:#FFFFFF; --danger:#D64545; --danger-soft:#FCE9E9;
    --shadow:0 12px 32px rgba(28,31,59,.16); --shadow-soft:0 2px 10px rgba(28,31,59,.06);
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="dark"]{
    --bg:#12132A; --surface:#1B1D3A; --line:#2B2E52; --ink:#ECEDFA; --sub:#9DA2C6;
    --bd:#8E98FF; --bd-soft:#26295A; --an:#FF7FA9; --an-soft:#40243A;
    --primary:#ECEDFA; --on-primary:#12132A; --danger:#FF8A8A; --danger-soft:#3D2430;
    --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-soft:0 2px 10px rgba(0,0,0,.25);
  }
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased; padding-top:var(--safe-top); line-height:1.5;
  }
  body.modal-open{ overflow:hidden; }
  button,input,select,textarea{ font-family:inherit; }
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{ outline:3px solid var(--bd); outline-offset:2px; }

  /* header */
  .cover{ position:sticky; top:0; z-index:20; background:var(--bg); padding:20px 20px 10px; }
  .cover-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .cover h1{ margin:0; font-size:26px; font-weight:900; letter-spacing:.02em; }
  .cover-sub{ margin:2px 0 0; font-size:12.5px; color:var(--sub); font-weight:500; }
  .header-btns{ display:flex; gap:8px; position:relative; flex-shrink:0; }
  .icon-btn{
    width:42px; height:42px; border-radius:14px; border:none; background:var(--surface);
    box-shadow:var(--shadow-soft); font-size:17px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .12s;
  }
  .icon-btn:active{ transform:scale(.92); }
  .menu-panel{
    position:absolute; top:50px; right:0; min-width:170px; padding:6px; z-index:30;
    background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
    opacity:0; visibility:hidden; transform:translateY(-6px); transition:.18s;
  }
  .menu-panel.open{ opacity:1; visibility:visible; transform:none; }
  .menu-panel button{ width:100%; text-align:left; padding:11px 12px; border:none; background:none; color:var(--ink); font-size:14px; font-weight:700; border-radius:10px; cursor:pointer; }
  .menu-panel button:hover{ background:var(--bg); }

  /* toolbar */
  .toolbar{ padding:8px 20px 10px; display:flex; gap:8px; align-items:center; }
  .toolbar select{
    flex:1; min-width:0; max-width:150px; padding:9px 12px; border-radius:12px; border:none;
    background:var(--surface); color:var(--ink); font-size:13px; font-weight:700; box-shadow:var(--shadow-soft);
  }
  .view-toggles{ display:flex; gap:2px; padding:3px; background:var(--line); border-radius:12px; }
  .view-toggles button{ border:none; background:transparent; padding:6px 11px; border-radius:9px; font-size:14px; cursor:pointer; color:var(--ink); }
  .view-toggles button.active{ background:var(--surface); box-shadow:var(--shadow-soft); }
  .count-badge{ margin-left:auto; font-size:12.5px; font-weight:700; color:var(--sub); white-space:nowrap; }

  /* main */
  main{ padding:4px 20px 150px; }
  .empty-state{ text-align:center; color:var(--sub); padding:64px 20px; font-size:14px; line-height:1.9; font-weight:500; }
  .empty-state .big{ font-size:40px; display:block; margin-bottom:12px; }

  /* rich card */
  .card{
    display:flex; gap:14px; padding:14px; margin-bottom:12px; background:var(--surface);
    border-radius:20px; box-shadow:var(--shadow-soft); border:2px solid transparent;
  }
  .card.pinned{ border-color:var(--accent-line, var(--line)); }
  .t-bd{ --c:var(--bd); --cs:var(--bd-soft); --accent-line:var(--bd); }
  .t-an{ --c:var(--an); --cs:var(--an-soft); --accent-line:var(--an); }
  .count{
    flex-shrink:0; width:70px; border-radius:15px; background:var(--cs); color:var(--c);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 0; align-self:flex-start; min-height:74px;
  }
  .count-num{ font-size:30px; font-weight:900; line-height:1.05; }
  .count-unit{ font-size:11.5px; font-weight:700; margin-top:2px; }
  .count.today{ background:var(--c); color:var(--surface); }
  .count.today .count-num{ font-size:22px; }
  .card-body{ flex:1; min-width:0; }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .card-name{ margin:0; font-size:17px; font-weight:900; line-height:1.35; word-break:break-word; }
  .pin-toggle{ background:none; border:none; font-size:17px; cursor:pointer; opacity:.28; padding:2px 4px; flex-shrink:0; filter:grayscale(1); }
  .pin-toggle.active{ opacity:1; filter:none; }
  .card-date{ margin:3px 0 0; font-size:13px; font-weight:700; color:var(--sub); }
  .card-date .age{ color:var(--c); margin-left:8px; }
  .chip{ display:inline-block; margin-top:8px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--bg); color:var(--sub); }
  .card-note{ margin-top:8px; font-size:13px; color:var(--sub); line-height:1.65; white-space:pre-wrap; font-weight:500; }
  .card-actions{ margin-top:10px; display:flex; gap:8px; }
  .card-actions button{ font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px; border:none; background:var(--bg); color:var(--ink); cursor:pointer; }
  .card-actions button.danger{ background:var(--danger-soft); color:var(--danger); }

  /* slim */
  .slim{ display:flex; align-items:center; gap:10px; padding:10px 8px 10px 12px; margin-bottom:8px; background:var(--surface); border-radius:14px; box-shadow:var(--shadow-soft); border-left:5px solid var(--c); }
  .slim-body{ flex:1; min-width:0; }
  .slim-name{ font-size:14.5px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slim-meta{ font-size:12px; font-weight:700; color:var(--sub); }
  .slim-meta b{ color:var(--c); }
  .slim-actions{ display:flex; flex-shrink:0; }
  .slim-actions button{ background:none; border:none; font-size:15px; cursor:pointer; padding:8px; border-radius:50%; }
  .slim-actions button:hover{ background:var(--bg); }

  /* calendar */
  .calendar-wrap{ display:none; }
  .calendar-wrap.active{ display:block; }
  .cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-header button{ border:none; background:var(--surface); box-shadow:var(--shadow-soft); padding:8px 14px; border-radius:12px; cursor:pointer; color:var(--ink); font-size:13px; font-weight:700; }
  .cal-title{ font-size:17px; font-weight:900; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-head-cell{ text-align:center; font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:2px; }
  .cal-cell{ aspect-ratio:1; background:var(--surface); border-radius:12px; display:flex; flex-direction:column; align-items:center; padding:5px 2px 4px; cursor:pointer; box-shadow:var(--shadow-soft); }
  .cal-cell.empty{ background:transparent; box-shadow:none; cursor:default; }
  .cal-cell.today{ outline:2px solid var(--ink); outline-offset:-2px; }
  .cal-date{ font-size:13px; font-weight:700; }
  .cal-dots{ display:flex; gap:3px; margin-top:auto; flex-wrap:wrap; justify-content:center; }
  .dot{ width:7px; height:7px; border-radius:50%; }
  .dot.bd{ background:var(--bd); } .dot.an{ background:var(--an); }

  /* fab & ad slot */
  .fab{
    position:fixed; right:18px; bottom:calc(22px + var(--safe-bottom)); width:58px; height:58px; border-radius:20px; border:none;
    background:var(--primary); color:var(--on-primary); font-size:28px; box-shadow:var(--shadow); cursor:pointer; z-index:25;
    display:flex; align-items:center; justify-content:center; transition:transform .12s;
  }
  .fab:active{ transform:scale(.92); }
  .ad-slot{ position:fixed; left:0; right:0; bottom:0; z-index:15; padding:8px 14px calc(8px + var(--safe-bottom)); background:var(--bg); display:flex; justify-content:center; }
  .ad-slot:empty{ display:none; }
  body:has(.ad-slot:not(:empty)) .fab{ bottom:calc(84px + var(--safe-bottom)); }

  /* modal */
  .modal-overlay{ position:fixed; inset:0; background:rgba(12,13,30,.55); opacity:0; visibility:hidden; display:flex; align-items:flex-end; justify-content:center; z-index:50; transition:.25s; }
  .modal-overlay.open{ opacity:1; visibility:visible; }
  .modal-card{
    background:var(--bg); width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
    border-radius:26px 26px 0 0; padding:0 20px calc(20px + var(--safe-bottom));
    transform:translateY(100%); transition:.3s cubic-bezier(.2,.9,.25,1);
  }
  .modal-overlay.open .modal-card{ transform:none; }
  @media (min-width:520px){
    .modal-overlay{ align-items:center; }
    .modal-card{ border-radius:26px; transform:translateY(16px) scale(.97); }
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg); padding:20px 0 12px; z-index:5; }
  .modal-head h2{ margin:0; font-size:19px; font-weight:900; }
  .modal-head button{ width:34px; height:34px; border:none; border-radius:12px; background:var(--surface); color:var(--sub); font-size:14px; cursor:pointer; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:6px; }
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%; padding:12px 14px; border-radius:14px; border:2px solid transparent; background:var(--surface);
    color:var(--ink); font-size:16px; box-shadow:var(--shadow-soft);
  }
  .field textarea{ min-height:84px; resize:vertical; }
  .req{ color:var(--an); }
  .row3{ display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:10px; }
  .segmented{ display:flex; gap:4px; padding:4px; background:var(--line); border-radius:16px; }
  .segmented input{ display:none; }
  .segmented label{ flex:1; margin:0; text-align:center; padding:10px 0; font-size:14px; font-weight:700; color:var(--sub); border-radius:12px; cursor:pointer; transition:.15s; }
  .segmented input:checked + label{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-soft); }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; margin-bottom:14px; border-radius:14px; background:var(--surface); box-shadow:var(--shadow-soft); }
  .switch-row > span{ font-size:14px; font-weight:700; }
  .switch{ position:relative; width:48px; height:28px; display:inline-block; margin:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{ position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.2s; }
  .switch .track:before{ content:''; position:absolute; width:22px; height:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .switch input:checked + .track{ background:var(--bd); }
  .switch input:checked + .track:before{ transform:translateX(20px); }
  .btn-primary,.btn-secondary{ width:100%; padding:14px; border:none; border-radius:16px; font-size:15px; font-weight:900; cursor:pointer; }
  .btn-primary{ background:var(--primary); color:var(--on-primary); }
  .btn-secondary{ background:transparent; color:var(--sub); margin-top:6px; font-weight:700; }
  .btn-primary:active,.btn-secondary:active{ transform:scale(.98); }

  /* popup */
  .popup-overlay{ position:fixed; inset:0; background:rgba(12,13,30,.68); opacity:0; visibility:hidden; display:flex; align-items:center; justify-content:center; z-index:100; padding:22px; transition:.25s; }
  .popup-overlay.open{ opacity:1; visibility:visible; }
  .popup-card{ background:var(--surface); border-radius:28px; padding:30px 24px 24px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow); transform:scale(.94); transition:.3s cubic-bezier(.2,.9,.3,1.2); }
  .popup-overlay.open .popup-card{ transform:none; }
  .popup-seal{ width:60px; height:60px; border-radius:50%; background:var(--bd-soft); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto; }
  .popup-label{ font-size:13px; font-weight:700; color:var(--sub); margin-top:14px; }
  .popup-title{ font-size:22px; font-weight:900; margin:4px 0 12px; line-height:1.4; color:var(--bd); word-break:break-word; }
  .popup-desc{ font-size:13.5px; color:var(--sub); line-height:1.8; margin-bottom:22px; font-weight:500; }
  .popup-close-btn{ width:100%; padding:14px; border:none; border-radius:16px; background:var(--primary); color:var(--on-primary); font-size:15px; font-weight:900; cursor:pointer; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<header class="cover">
  <div class="cover-row">
    <div>
      <h1>記念日ノート</h1>
      <p class="cover-sub">誕生日と記念日を、ひとつのノートに。</p>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="themeToggle" aria-label="ダークモード切替">🌙</button>
      <button class="icon-btn" id="menuBtn" aria-label="メニュー">⋮</button>
      <div class="menu-panel" id="menuPanel">
        <button type="button" id="exportBtn">📤 エクスポート</button>
        <button type="button" id="importBtn">📥 インポート</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
</header>

<div class="toolbar">
  <select id="groupFilter" aria-label="グループ"></select>
  <div class="view-toggles" id="viewToggles">
    <button data-view="rich" class="active" aria-label="リッチ表示">📋</button>
    <button data-view="slim" aria-label="スリム表示">📜</button>
    <button data-view="calendar" aria-label="カレンダー">📅</button>
  </div>
  <span class="count-badge" id="countBadge"></span>
</div>

<main id="entryList"></main>

<main class="calendar-wrap" id="calendarView">
  <div class="cal-header">
    <button id="calPrev">◀ 先月</button>
    <div class="cal-title" id="calTitle"></div>
    <button id="calNext">来月 ▶</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</main>

<button class="fab" id="fabAdd" aria-label="新規登録">＋</button>

<!-- 広告枠（PR表記付き・中央揃え） -->
<div class="ad-slot" id="adSlot" style="display:flex; flex-direction:column; align-items:center;">
  <div style="font-size:10px; color:var(--sub); text-align:center; margin-bottom:4px; letter-spacing:0.05em;">※PR</div>

</div>

<div class="modal-overlay" id="entryModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">新規登録</h2>
      <button type="button" id="modalClose" aria-label="閉じる">✕</button>
    </div>
    <form id="entryForm">
      <div class="field">
        <label>タイプ</label>
        <div class="segmented">
          <input type="radio" id="type_birthday" name="type" value="birthday" checked>
          <label for="type_birthday">🎂 誕生日</label>
          <input type="radio" id="type_anniversary" name="type" value="anniversary">
          <label for="type_anniversary">💍 記念日</label>
        </div>
      </div>
      <div class="field">
        <label for="f_name">名前<span class="req"> *</span></label>
        <input type="text" id="f_name" placeholder="例：田中 花子" required>
      </div>
      <div class="row3">
        <div class="field"><label for="f_year">年（任意）</label><input type="number" id="f_year" placeholder="1990"></div>
        <div class="field"><label for="f_month">月</label><select id="f_month"></select></div>
        <div class="field"><label for="f_day">日</label><select id="f_day"></select></div>
      </div>

        <label class="switch"><input type="checkbox" id="f_pinned"><span class="track"></span></label>

      <button type="submit" class="btn-primary">保存する</button>

</div>

<div class="modal-overlay" id="calDetailModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="calDetailTitle"></h2>
      <button type="button" id="calDetailClose" aria-label="閉じる">✕</button>

  </div>
</div>

<div class="popup-overlay" id="dayPopup">

    <div class="popup-label">今日は</div>
    <div class="popup-title" id="popupTitle"></div>
    <button type="button" class="popup-close-btn" style="margin-top:22px;" id="popupCloseBtn">閉じる</button>
  </div>
</div>

<div class="popup-overlay" id="customDialogOverlay" style="z-index:200;">
  <div class="popup-card" style="padding:24px;">
    <div class="popup-title" id="customDialogTitle" style="font-size:18px;color:var(--ink);margin-top:0;"></div>
    <div class="popup-desc" id="customDialogMessage" style="margin-bottom:22px;"></div>
    <div style="display:flex;gap:10px;">
      <button type="button" class="btn-secondary" id="customDialogCancel" style="margin-top:0;">キャンセル</button>
      <button type="button" class="btn-primary" id="customDialogConfirm">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var currentFilter = 'all';

  var editingId = null;

  var entryModal = document.getElementById('entryModal');
  var entryForm = document.getElementById('entryForm');
  var dayPopup = document.getElementById('dayPopup');
  var menuPanel = document.getElementById('menuPanel');
  var calDetailModal = document.getElementById('calDetailModal');

  function loadEntries(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
  }
  function saveEntries(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){}
  }
  function uid(){ return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ---------- dialog ---------- */
  function showDialog(o){
    return new Promise(function(resolve){
      document.getElementById('customDialogTitle').textContent = o.title || '確認';
      document.getElementById('customDialogMessage').textContent = o.message || '';
      var btnCancel = document.getElementById('customDialogCancel');
      var btnConfirm = document.getElementById('customDialogConfirm');
      if(o.type === 'alert'){
        btnCancel.style.display = 'none';
        btnConfirm.textContent = 'OK';
      }else{
        btnCancel.style.display = 'block';
        btnConfirm.textContent = o.confirmText || 'はい';
        btnCancel.textContent = o.cancelText || 'いいえ';
      }
      function cleanup(){
        btnConfirm.removeEventListener('click', ok);
        btnCancel.removeEventListener('click', ng);
        dialogOverlay.classList.remove('open');
        refreshScrollLock();
      }
      function ok(){ cleanup(); resolve(true); }
      function ng(){ cleanup(); resolve(false); }
      btnConfirm.addEventListener('click', ok);
      btnCancel.addEventListener('click', ng);
      dialogOverlay.classList.add('open');
      refreshScrollLock();
    });
  }

  /* ---------- date helpers ---------- */
  function todayDateOnly(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function isLeap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
  function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
  function getNextOccurrence(entry){
    var base = todayDateOnly();
    function build(year){
      var d = entry.day;
      if(entry.month === 2 && entry.day === 29 && !isLeap(year)) d = 28;
      return new Date(year, entry.month - 1, d);
    }
    var c = build(base.getFullYear());
    if(c < base) c = build(base.getFullYear() + 1);
    return c;
  }
  function daysUntil(date){ return Math.round((date.getTime() - todayDateOnly().getTime()) / 86400000); }

  var MILESTONE_AGES = [18,20,30,40,50,60,70,77,80,88,90,99,100];
  var MILESTONE_ANNIV = [1,3,5,10,15,20,25,30,40,50,60,70];
  function isMilestone(entry, count){
    if(count == null) return false;
    return (entry.type === 'birthday' ? MILESTONE_AGES : MILESTONE_ANNIV).indexOf(count) !== -1;
  }
  function enrich(e){
    var next = getNextOccurrence(e);
    var count = e.year ? next.getFullYear() - e.year : null;
    return Object.assign({}, e, { _days: daysUntil(next), _count: count, _milestone: isMilestone(e, count) });
  }
  function typeClass(e){ return e.type === 'birthday' ? 't-bd' : 't-an'; }
  function countLabel(e){ return e._count == null ? '' : (e.type === 'birthday' ? e._count + '歳' : e._count + '周年'); }

  /* ---------- cards ---------- */
  function renderRichCard(e){
    var icon = e.type === 'birthday' ? '🎂' : '💍';
    var today = e._days === 0;
    var countHtml = today
      ? '<div class="count today"><span class="count-num">今日</span></div>'
      : '<div class="count"><span class="count-num">' + e._days + '</span><span class="count-unit">日後</span></div>';
    var crown = e._milestone ? ' <span title="記念すべき節目です！">👑</span>' : '';
    var cl = countLabel(e);
    return '<article class="card ' + typeClass(e) + (e.pinned ? ' pinned' : '') + '">' +
      countHtml +
      '<div class="card-body">' +
        '<div class="card-head">' +
          '<h3 class="card-name">' + icon + ' ' + escapeHtml(e.name) + crown + '</h3>' +
          '<button type="button" class="pin-toggle' + (e.pinned ? ' active' : '') + '" data-action="pin" data-id="' + e.id + '" aria-label="ピン留め">📌</button>' +
        '</div>' +
        '<p class="card-date">' + e.month + '月' + e.day + '日' + (cl ? '<span class="age">' + cl + '</span>' : '') + '</p>' +
        (e.group ? '<span class="chip">' + escapeHtml(e.group) + '</span>' : '') +
        (e.note ? '<div class="card-note">' + escapeHtml(e.note) + '</div>' : '') +
        '<div class="card-actions">' +
          '<button type="button" data-action="edit" data-id="' + e.id + '">編集</button>' +
          '<button type="button" class="danger" data-action="delete" data-id="' + e.id + '">削除</button>' +
        '</div>' +
      '</div></article>';
  }

  function renderSlimCard(e){
    var icon = e.type === 'birthday' ? '🎂' : '💍';
    var cl = countLabel(e);
    var d = e._days === 0 ? '今日！' : 'あと' + e._days + '日';
    return '<div class="slim ' + typeClass(e) + '">' +
      '<div class="slim-body">' +
        '<div class="slim-name">' + icon + ' ' + escapeHtml(e.name) + (e.pinned ? ' 📌' : '') + '</div>' +
        '<div class="slim-meta">' + e.month + '月' + e.day + '日 ' + (cl ? cl + ' ' : '') + '<b>' + d + '</b></div>' +
      '</div>' +
      '<div class="slim-actions">' +
        '<button type="button" data-action="edit" data-id="' + e.id + '" aria-label="編集">✏️</button>' +
        '<button type="button" data-action="delete" data-id="' + e.id + '" aria-label="削除">🗑️</button>' +
      '</div></div>';
  }

  /* ---------- main render ---------- */
  function renderView(){
    var groups = [];
    entries.forEach(function(e){ if(e.group && groups.indexOf(e.group) === -1) groups.push(e.group); });
    groups.sort();
    var sel = document.getElementById('groupFilter');
    var html = '<option value="all">すべてのグループ</option>';
    groups.forEach(function(g){ html += '<option value="' + escapeHtml(g) + '">' + escapeHtml(g) + '</option>'; });
    sel.innerHTML = html;
    if(groups.indexOf(currentFilter) === -1) currentFilter = 'all';
    sel.value = currentFilter;

    var list = entries.filter(function(e){ return currentFilter === 'all' || e.group === currentFilter; })
      .map(enrich)
      .sort(function(a,b){ return a.pinned === b.pinned ? a._days - b._days : (a.pinned ? -1 : 1); });

    document.getElementById('countBadge').textContent = list.length + '件';
    var listEl = document.getElementById('entryList');
    var calEl = document.getElementById('calendarView');

    if(currentView === 'calendar'){
      listEl.style.display = 'none';
      calEl.classList.add('active');
      renderCalendar();
    }else{
      calEl.classList.remove('active');
      listEl.style.display = 'block';
      listEl.innerHTML = list.length === 0
        ? '<div class="empty-state"><span class="big">📭</span>まだ登録がありません<br>右下の＋ボタンから追加しましょう</div>'
        : list.map(function(e){ return currentView === 'rich' ? renderRichCard(e) : renderSlimCard(e); }).join('');
    }
  }

  /* ---------- calendar ---------- */
  function renderCalendar(){
    var year = calCurrentDate.getFullYear(), month = calCurrentDate.getMonth();
    document.getElementById('calTitle').textContent = year + '年 ' + (month + 1) + '月';
    var firstDay = new Date(year, month, 1).getDay();
    var total = daysInMonth(year, month + 1);
    var now = new Date();
    var isCur = now.getFullYear() === year && now.getMonth() === month;
    var html = ['日','月','火','水','木','金','土'].map(function(w){ return '<div class="cal-head-cell">' + w + '</div>'; }).join('');
    for(var i=0;i<firstDay;i++) html += '<div class="cal-cell empty"></div>';
    for(var d=1; d<=total; d++){
      var dots = entries.filter(function(e){ return e.month === month + 1 && e.day === d; })
        .map(function(e){ return '<span class="dot ' + (e.type === 'birthday' ? 'bd' : 'an') + '"></span>'; }).join('');
      html += '<div class="cal-cell' + (isCur && now.getDate() === d ? ' today' : '') + '" data-day="' + d + '">' +
        '<div class="cal-date">' + d + '</div><div class="cal-dots">' + dots + '</div></div>';
    }
    document.getElementById('calGrid').innerHTML = html;
  }
  document.getElementById('calPrev').addEventListener('click', function(){ calCurrentDate.setDate(1); calCurrentDate.setMonth(calCurrentDate.getMonth() - 1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', function(){ calCurrentDate.setDate(1); calCurrentDate.setMonth(calCurrentDate.getMonth() + 1); renderCalendar(); });

  document.getElementById('calGrid').addEventListener('click', function(ev){
    var cell = ev.target.closest('.cal-cell');
    if(!cell || cell.classList.contains('empty')) return;
    var d = parseInt(cell.getAttribute('data-day'), 10);
    var m = calCurrentDate.getMonth() + 1;
    var dayEntries = entries.filter(function(e){ return e.month === m && e.day === d; });
    document.getElementById('calDetailTitle').textContent = m + '月' + d + '日';
    document.getElementById('calDetailList').innerHTML = dayEntries.length === 0
      ? '<div class="empty-state" style="padding:36px 0;">予定はありません</div>'
      : dayEntries.map(function(e){ return renderSlimCard(enrich(e)); }).join('');
    calDetailModal.classList.add('open');
    refreshScrollLock();
  });
  document.getElementById('calDetailClose').addEventListener('click', function(){
    calDetailModal.classList.remove('open'); refreshScrollLock();
  });

  /* ---------- actions ---------- */
  document.addEventListener('click', async function(ev){
    var btn = ev.target.closest('button[data-action]');
    if(!btn) return;
    var id = btn.getAttribute('data-id'), action = btn.getAttribute('data-action');
    if(action === 'pin') togglePin(id);
    if(action === 'edit') openEditModal(id);
    if(action === 'delete') await deleteEntry(id);
  });
  function togglePin(id){
    var e = entries.find(function(x){ return x.id === id; });
    if(e){ e.pinned = !e.pinned; saveEntries(); renderView(); }
  }
  async function deleteEntry(id){
    var e = entries.find(function(x){ return x.id === id; });
    if(!e) return;
    var ok = await showDialog({ type:'confirm', title:'削除の確認', message:'「' + e.name + '」を削除しますか？', confirmText:'削除する' });
    if(ok){
      entries = entries.filter(function(x){ return x.id !== id; });
      saveEntries(); renderView();
      if(calDetailModal.classList.contains('open')){ calDetailModal.classList.remove('open'); refreshScrollLock(); }
    }
  }

  document.querySelectorAll('#viewToggles button').forEach(function(btn){
    btn.addEventListener('click', function(ev){
      document.querySelectorAll('#viewToggles button').forEach(function(b){ b.classList.remove('active'); });
      ev.currentTarget.classList.add('active');
      currentView = ev.currentTarget.dataset.view;
      renderView();
    });
  });
  document.getElementById('groupFilter').addEventListener('change', function(ev){ currentFilter = ev.target.value; renderView(); });

  /* ---------- form modal ---------- */
  function populateMonthSelect(){
    var html = '';
    for(var m=1;m<=12;m++) html += '<option value="' + m + '">' + m + '月</option>';
    document.getElementById('f_month').innerHTML = html;
  }
  function updateDayOptions(keepValue){
    var yearStr = document.getElementById('f_year').value;
    var year = yearStr ? parseInt(yearStr, 10) : 2024;
    var month = parseInt(document.getElementById('f_month').value, 10);
    var daySel = document.getElementById('f_day');
    var prev = keepValue != null ? keepValue : daySel.value;
    var max = daysInMonth(year, month), html = '';
    for(var d=1; d<=max; d++) html += '<option value="' + d + '">' + d + '日</option>';
    daySel.innerHTML = html;
    if(prev && parseInt(prev, 10) <= max) daySel.value = prev;
  }
  document.getElementById('f_month').addEventListener('change', function(){ updateDayOptions(); });
  document.getElementById('f_year').addEventListener('input', function(){ updateDayOptions(); });

  function refreshScrollLock(){
    var locked = dayPopup.classList.contains('open') || entryModal.classList.contains('open') ||
                 calDetailModal.classList.contains('open') || dialogOverlay.classList.contains('open');
    document.body.classList.toggle('modal-open', locked);
  }
  function openEditModal(id){
    editingId = id;
    var e = id ? entries.find(function(x){ return x.id === id; }) : null;
    document.getElementById('modalTitle').textContent = id ? '編集' : '新規登録';
    document.getElementById(e && e.type === 'anniversary' ? 'type_anniversary' : 'type_birthday').checked = true;
    document.getElementById('f_name').value = e ? e.name : '';
    document.getElementById('f_year').value = (e && e.year) ? e.year : '';
    document.getElementById('f_month').value = e ? e.month : (new Date().getMonth() + 1);
    updateDayOptions(e ? e.day : new Date().getDate());
    document.getElementById('f_group').value = e ? (e.group || '') : '';
    document.getElementById('f_note').value = e ? (e.note || '') : '';
    document.getElementById('f_pinned').checked = e ? !!e.pinned : false;
    entryModal.classList.add('open');
    refreshScrollLock();
    menuPanel.classList.remove('open');
  }
  function closeEditModal(){ entryModal.classList.remove('open'); editingId = null; refreshScrollLock(); }
  document.getElementById('fabAdd').addEventListener('click', function(){ openEditModal(null); });
  document.getElementById('modalClose').addEventListener('click', closeEditModal);
  document.getElementById('modalCancel').addEventListener('click', closeEditModal);
  entryModal.addEventListener('click', function(ev){ if(ev.target === entryModal) closeEditModal(); });
  calDetailModal.addEventListener('click', function(ev){ if(ev.target === calDetailModal){ calDetailModal.classList.remove('open'); refreshScrollLock(); } });

  entryForm.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var name = document.getElementById('f_name').value.trim();
    if(!name){ await showDialog({ type:'alert', title:'入力エラー', message:'名前を入力してください' }); return; }
    var yearRaw = document.getElementById('f_year').value;
    var data = {
      type: document.querySelector('input[name="type"]:checked').value,
      name: name,
      year: yearRaw ? parseInt(yearRaw, 10) : null,
      month: parseInt(document.getElementById('f_month').value, 10),
      day: parseInt(document.getElementById('f_day').value, 10),
      group: document.getElementById('f_group').value.trim(),
      note: document.getElementById('f_note').value,
      pinned: document.getElementById('f_pinned').checked
    };
    if(editingId){
      var idx = entries.findIndex(function(x){ return x.id === editingId; });
      if(idx !== -1){ data.id = entries[idx].id; entries[idx] = data; }
    }else{
      data.id = uid(); entries.push(data);
    }
    saveEntries(); closeEditModal(); renderView();
    if(calDetailModal.classList.contains('open')){ calDetailModal.classList.remove('open'); refreshScrollLock(); }
  });

  /* ---------- menu: export / import ---------- */
  document.getElementById('menuBtn').addEventListener('click', function(ev){ ev.stopPropagation(); menuPanel.classList.toggle('open'); });
  document.addEventListener('click', function(ev){
    if(!menuPanel.contains(ev.target) && ev.target.id !== 'menuBtn') menuPanel.classList.remove('open');
  });
  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(entries, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var t = new Date();
    var ymd = t.getFullYear() + String(t.getMonth()+1).padStart(2,'0') + String(t.getDate()).padStart(2,'0');
    a.href = url; a.download = '記念日データ_' + ymd + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url); menuPanel.classList.remove('open');
  });
  document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function(ev){
    var input = ev.target, file = input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!Array.isArray(data)) throw new Error('invalid');
        var valid = data.filter(function(x){ return x && typeof x.name === 'string' && x.month && x.day; });
        if(valid.length === 0){ await showDialog({ type:'alert', title:'エラー', message:'有効なデータが見つかりませんでした' }); input.value = ''; return; }
        var ok = await showDialog({ type:'confirm', title:'インポートの確認', message: valid.length + '件のデータを追加しますか？', confirmText:'追加する' });
        if(ok){
          valid.forEach(function(x){
            entries.push({ id:uid(), type: x.type === 'anniversary' ? 'anniversary' : 'birthday', name:x.name,
              year:x.year || null, month:x.month, day:x.day, group:x.group || '', note:x.note || '', pinned:!!x.pinned });
          });
          saveEntries(); renderView();
          await showDialog({ type:'alert', title:'完了', message:'読み込みが完了しました' });
        }
      }catch(err){
        await showDialog({ type:'alert', title:'エラー', message:'ファイルの読み込みに失敗しました。' });
      }
      input.value = '';
    };
    reader.readAsText(file); menuPanel.classList.remove('open');
  });

  /* ---------- theme ---------- */
  function updateThemeIcon(){
    document.getElementById('themeToggle').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  document.getElementById('themeToggle').addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    updateThemeIcon();
  });

  /* ---------- today popup ---------- */
  function showDayPopup(){
    var t = new Date();
    var arr = (RAW_DAYS[t.getMonth() + 1] || '').split(',');
    var fact = arr[t.getDate() - 1] || '何か';
    document.getElementById('popupTitle').textContent = '「' + fact + '」の日です！';
    setTimeout(function(){ dayPopup.classList.add('open'); refreshScrollLock(); }, 100);
  }
  document.getElementById('popupCloseBtn').addEventListener('click', function(){
    dayPopup.classList.remove('open'); refreshScrollLock();
  });

  /* ---------- init ---------- */
  document.addEventListener('DOMContentLoaded', function(){
    populateMonthSelect();
    updateDayOptions(new Date().getDate());
    document.getElementById('f_year').max = new Date().getFullYear() + 5;
    updateThemeIcon();
    renderView();
    showDayPopup();
  });
})();
</script>
</body>
</html>
